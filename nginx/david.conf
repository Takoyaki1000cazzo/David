# David 本番用 Nginx 設定テンプレート
# 使い方:
#   1. <APP_ROOT> をアプリ配置パスに、<SERVER_NAME> を公開ホスト名に置換する
#      例: sed -e "s|<APP_ROOT>|/srv/david|g" -e "s|<SERVER_NAME>|ehon.example.com|g" \
#             nginx/david.conf | sudo tee /etc/nginx/sites-available/david
#   2. sudo ln -s /etc/nginx/sites-available/david /etc/nginx/sites-enabled/david
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 前提: Gunicorn が同一ホストの 127.0.0.1:8000 で起動していること
# (gunicorn.conf.py の bind と対応。別ホストの場合は proxy_pass を変更)

upstream david_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name <SERVER_NAME>;

    # 画像アップロード上限(アプリ側は5MB)。余裕を見て10m
    client_max_body_size 10m;

    # /static/ は collectstatic 成果物を Nginx が直接配信
    location /static/ {
        alias <APP_ROOT>/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # /media/ はアップロード画像を Nginx が直接配信
    location /media/ {
        alias <APP_ROOT>/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 上記以外(HTML描画・API・管理画面)は Gunicorn へリバースプロキシ
    location / {
        proxy_pass http://david_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
