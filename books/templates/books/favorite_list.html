<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おきにいり - David</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:12px 16px 32px; background:#FFF8E7; color:#4A2F14; font-family:'Zen Maru Gothic',sans-serif; }
  .container { max-width:960px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-top:12px; }
  .card { background:#fff; border:2px solid #E6D2B4; border-radius:16px; padding:10px; }
  a { color:#5A3C1E; }
  button { font-size:14px; padding:6px 12px; border-radius:10px; border:2px solid #FF9646; background:#fff; color:#E46A1A; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
<nav style="display:flex;gap:12px;align-items:center;justify-content:flex-end;font-size:14px;">
<span>{{ user.username }}さん</span>
<form method="post" action="{% url 'logout' %}" style="margin:0;display:inline;">{% csrf_token %}<button type="submit" style="background:none;border:none;padding:0;font-family:inherit;font-size:14px;color:#5A3C1E;text-decoration:underline;cursor:pointer;">ログアウト</button></form>
</nav>
<h1>♥ おきにいり</h1>
<p><a href="{% url 'book-list' %}">← いちらんにもどる</a></p>
<div class="grid">
{% for favorite in favorites %}
<div class="card">
<strong><a href="{% url 'book-detail' favorite.book.pk %}">{{ favorite.book.title }}</a></strong><br>
たいしょうねんれい: {{ favorite.book.age_min }}〜{{ favorite.book.age_max }}さい
<form method="post" action="{% url 'favorite-remove' favorite.book.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{% url 'favorite-list' %}"><button type="submit">おきにいりをはずす</button></form>
</div>
{% empty %}
<p>おきにいりはまだないよ。</p>
{% endfor %}
</div>
</div>
</body>
</html>
